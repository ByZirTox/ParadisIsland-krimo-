<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f5a63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>गाँव बाज़ार</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="hud" aria-label="Resources"></header>

  <main id="stage">
    <canvas id="c" aria-label="Village map"></canvas>
    <div id="toasts" aria-live="polite"></div>
    <button id="adBtn" type="button" hidden></button>
  </main>

  <div id="hint"></div>

  <nav id="bar">
    <button class="tab" id="bBuild" type="button"></button>
    <button class="tab" id="bGift" type="button"></button>
    <button class="tab" id="bFest" type="button"></button>
    <button class="tab" id="bSet" type="button"></button>
  </nav>
</div>

<div id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h2 id="mTitle"></h2>
    <div id="mBody"></div>
    <div id="mFoot"></div>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
